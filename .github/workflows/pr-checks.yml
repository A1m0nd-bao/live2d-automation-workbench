name: PR Checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and Pages build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run frontend and rig regression tests
        run: node --test scripts/test-prep-policy.mjs tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test PSD-first pose and durable batch queues (no provider requests)
        run: |
          pip install -r worker/requirements.txt fastapi
          python -m unittest worker/test_psd_pose.py worker/test_pro_queue.py worker/test_prep_queue.py worker/test_batch_queue.py worker/test_batch_recovery.py -q
      # PR code gets no deployment credentials or service secrets.
      - name: Build Pages without deploying
        run: npm run build:pages
